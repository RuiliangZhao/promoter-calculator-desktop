name: Verify browser release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm verify

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: chromium
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Check tag and package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - run: pnpm release
      - name: Publish release assets
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes --title "Promoter Calculator Desktop $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
