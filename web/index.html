<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' blob:; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self' data:"><title>Promoter Calculator Desktop</title><style>__STYLES__</style></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">≋</span><div><strong>Promoter Calculator Desktop</strong><small data-i18n="appSubtitle"></small></div><span class="version">0.9.0</span></div><nav><button id="newProject" data-i18n="new"></button><button id="openProject" data-i18n="openProject"></button><button id="saveProject" data-i18n="saveProject" disabled></button><button id="help" data-i18n="help"></button><div class="language" role="group" data-label="language"><button id="langZh" lang="zh-CN">中文</button><button id="langEn" lang="en">English</button></div></nav></header>
<main>
<section class="input-card">
<div class="input-form"><label for="title" data-i18n="title"></label><input id="title" maxlength="250" data-placeholder="titlePlaceholder" ><div class="label-row"><label for="sequence" data-i18n="sequence"></label><span id="seqCount" class="muted"></span></div><textarea id="sequence" spellcheck="false" autocapitalize="off" data-placeholder="sequencePlaceholder"></textarea><p class="hint" data-i18n="inputHint"></p><div class="input-actions"><button id="importFasta" data-i18n="importFasta"></button><button id="example" data-i18n="example"></button><button id="clearInput" class="text-button" data-i18n="clear"></button></div><div class="run-row"><div class="model-select"><label for="mode" data-i18n="calibration"></label><select id="mode"><option value="ecoli" data-i18n="ecoli"></option><option value="invitro" data-i18n="invitro"></option></select></div><button id="cancel" disabled data-i18n="cancel"></button><button id="run" class="primary" data-i18n="run"></button></div></div></section>
<div class="status-row"><p id="status" role="status" aria-live="polite"></p><progress id="progress" max="1" value="0" hidden></progress></div><p id="stale" class="notice" data-i18n="stale" hidden></p>
<section id="empty" class="empty-state"><div class="empty-line" aria-hidden="true">▁▂▁▁▃▇▅▁▂▁▁▃▁</div><h2 data-i18n="emptyState"></h2><p data-i18n="emptyDescription"></p></section>
<div id="results" hidden>
<section class="result-summary"><div><span class="eyebrow" data-i18n="resultHeading"></span><h2 id="resultName"></h2><span id="resultMode" class="muted"></span></div><div class="stat"><span data-i18n="length"></span><strong id="resultLength"></strong></div><div class="stat"><span data-i18n="candidateCount"></span><strong id="resultCount"></strong></div><div class="stat"><span data-i18n="maxRate"></span><strong id="resultMax"></strong></div></section>
<p class="coordinate-note" data-i18n="coordinates"></p><p id="coverage" class="hint"></p>
<details open class="result-card"><summary><span class="section-number">01</span><span data-i18n="chartTitle"></span></summary><div class="section-body"><div class="section-toolbar"><p class="hint" data-i18n="chartHint"></p><div class="actions"><label class="check"><input type="checkbox" id="logAxis"><span data-i18n="logAxis"></span></label><button id="resetZoom" data-i18n="resetZoom"></button><button id="png" data-i18n="exportPng"></button></div></div><div id="chart" role="region" data-label="chartTitle"></div></div></details>
<details open class="result-card"><summary><span class="section-number">02</span><span data-i18n="annotationTitle"></span></summary><div class="section-body"><div class="annotation-toolbar"><div class="threshold-control"><label for="thresholdNumber" data-i18n="threshold"></label><p id="thresholdHint" class="hint" data-i18n="thresholdHint"></p><div class="range-row"><input id="threshold" aria-describedby="thresholdHint" type="range" min="0" max="1" step="any" data-label="threshold"><input id="thresholdNumber" type="number" min="0" step="any"></div></div><div class="actions"><button id="showAll" data-i18n="showAll"></button><button id="resetThreshold" data-i18n="resetThreshold"></button><label class="check"><input id="motifs" type="checkbox" checked><span data-i18n="motifs"></span></label><button id="svg" data-i18n="exportSvg"></button></div></div><div class="annotation-meta"><span id="annotationCount"></span><span id="selectedBelow" class="notice-inline" data-i18n="selectedBelow" hidden></span></div><div id="motifLegend" class="legend"></div><div id="sequenceRuler"></div><div id="annotationScroll" tabindex="0" data-label="annotationTitle"><div id="annotationSpace"><svg id="annotationSvg" xmlns="http://www.w3.org/2000/svg"></svg></div></div><p id="annotationStatus" class="hint"></p><p class="hint" data-i18n="visibleSvg"></p><section id="promoterDetails" class="promoter-details"></section></div></details>
<details open class="result-card"><summary><span class="section-number">03</span><span data-i18n="tableTitle"></span></summary><div class="section-body"><p class="hint" data-i18n="tableHint"></p><div id="constants" class="constants"></div><div class="table-toolbar"><label><span data-i18n="strand"></span><select id="tableStrand"><option value="both" data-i18n="both"></option><option value="+" data-i18n="forward"></option><option value="-" data-i18n="reverse"></option></select></label><label><span data-i18n="from"></span><input type="number" id="filterFrom" min="1"></label><label><span data-i18n="to"></span><input type="number" id="filterTo" min="1"></label><button id="applyFilter" data-i18n="apply"></button><button id="resetFilter" data-i18n="resetFilter"></button><div class="locate"><label for="locateTSS" data-i18n="locate"></label><input id="locateTSS" type="number" min="1"><button id="locateButton" data-i18n="locateButton"></button></div></div><div class="table-scroll"><table id="energyTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><div class="pagination"><label><span data-i18n="perPage"></span><select id="pageSize"><option>5</option><option selected>10</option><option>25</option><option>50</option><option>100</option></select></label><span id="pageLabel"></span><div><button id="previous" data-i18n="previous"></button><button id="next" data-i18n="next"></button></div></div></div></details>
<section class="export-card"><div><h2 data-i18n="exportTitle"></h2><p id="exportCount" class="hint"></p></div><div class="actions"><label><span data-i18n="exportScope"></span><select id="exportScope"><option value="all" data-i18n="allResults"></option><option value="filtered" data-i18n="filteredResults"></option></select></label><label><span data-i18n="format"></span><select id="exportFormat"><option value="csv">CSV</option><option value="tsv">TSV</option></select></label><button id="exportData" class="primary" data-i18n="exportData"></button></div></section>
</div>
</main>
<div id="modalOverlay" class="modal-overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div class="modal-body"><p id="modalText"></p><section id="citationSection" hidden><p data-i18n="citationPrompt"></p><p class="citation" lang="en">LaFleur, T. L., Hossain, A. &amp; Salis, H. M. Automated model-predictive design of synthetic promoters to control transcriptional profiles in bacteria. <em>Nature Communications</em> <strong>13</strong>, 5159 (2022). <a id="citationDoi" href="https://doi.org/10.1038/s41467-022-32829-5" target="_blank" rel="noopener noreferrer">https://doi.org/10.1038/s41467-022-32829-5</a></p></section><section id="abstractSection" hidden><h3 data-i18n="abstractTitle"></h3><blockquote lang="en" data-i18n="abstractText"></blockquote><p class="abstract-source" data-i18n="abstractSource"></p></section></div><div class="actions"><a id="paperLink" href="https://www.nature.com/articles/s41467-022-32829-5" target="_blank" rel="noopener noreferrer" data-i18n="paper" hidden></a><button id="modalCancel" data-i18n="cancel" hidden></button><button id="modalConfirm" class="primary"></button></div></section></div>
<input type="file" id="fileInput" hidden accept=".fa,.fasta,.fna,.txt,.json">
<script>__SCRIPT__</script>
</body></html>
